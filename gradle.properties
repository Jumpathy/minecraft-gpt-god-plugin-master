org.gradle.jvmargs=-Xmx2G

# Paper 26.3 (Minecraft 26.3) needs Java 25, so the plugin is built for Java 25.
java_version=25

# The Minecraft version this is built for. paper_build pins the exact Paper API build.
minecraft_version=26.3
bukkit_api_version=26.3
bukkit_version=26.3.build.246-stable

# Target an older API to make it compatible with older versions of Simple Voice Chat
voicechat_api_version=2.4.11

# The WorldEdit API the optional `worldedit` power is compiled against (the server brings its own)
worldedit_version=7.3.9
# The APIs the optional WorldGuard and CoreProtect hooks are compiled against (the server brings its own)
worldguard_version=7.0.21
coreprotect_version=24.1

# Runtime libraries Paper downloads for us (plugin.yml `libraries:`)
anthropic_sdk_version=3.3.0
whisper_jni_version=1.7.1
# The sandboxed JavaScript interpreter behind the `script` power (pure Java, no dependencies)
rhino_version=1.9.2

plugin_version=0.2.0
maven_group=net.bigyous.gptgodmc
archives_base_name=gptgodmc
