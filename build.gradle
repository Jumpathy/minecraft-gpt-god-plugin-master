plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = maven_group
version = plugin_version
base {
    archivesName = archives_base_name
}

// Paper 26.3 runs on Java 25. Gradle compiles and tests with a Java 25 toolchain, which it
// downloads by itself if this machine does not have one (see settings.gradle).
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'henkelmax.public'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }
    maven {
        // Only for the optional CoreProtect hook's API (compile time; never bundled).
        name = 'playpro'
        url = 'https://maven.playpro.com/'
        content { includeGroup 'net.coreprotect' }
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${bukkit_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    // Optional hook: only used when the WorldEdit (or FastAsyncWorldEdit) plugin is installed.
    compileOnly("com.sk89q.worldedit:worldedit-core:${worldedit_version}") { transitive = false }
    compileOnly("com.sk89q.worldedit:worldedit-bukkit:${worldedit_version}") { transitive = false }
    // More optional hooks (god/hooks): used only when that plugin is installed. GriefPrevention, Towny and
    // LibsDisguises are reached by reflection and need nothing here.
    compileOnly("com.sk89q.worldguard:worldguard-core:${worldguard_version}") { transitive = false }
    compileOnly("net.coreprotect:coreprotect:${coreprotect_version}") { transitive = false }

    // These are NOT bundled into the jar. Paper downloads them on first start
    // through the `libraries:` list in plugin.yml (versions are filled in below).
    compileOnly "com.anthropic:anthropic-java:${anthropic_sdk_version}"
    compileOnly "io.github.givimad:whisper-jni:${whisper_jni_version}"
    compileOnly "org.mozilla:rhino:${rhino_version}"

    testImplementation "io.papermc.paper:paper-api:${bukkit_version}"
    testImplementation "com.anthropic:anthropic-java:${anthropic_sdk_version}"
    testImplementation "org.mozilla:rhino:${rhino_version}"
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def props = [
            version              : plugin_version,
            bukkit_api_version   : bukkit_api_version,
            anthropic_sdk_version: anthropic_sdk_version,
            whisper_jni_version  : whisper_jni_version,
            rhino_version        : rhino_version,
    ]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

test {
    useJUnitPlatform()
}

// `./gradlew shadowJar` is the documented build command; nothing is shaded any more,
// so the output is just the plugin classes and resources.
shadowJar {
    archiveClassifier = ''
}

jar {
    archiveClassifier = 'thin'
}

build.dependsOn shadowJar

// `./gradlew previews` runs the tests (which render the god offline) and copies those images into
// previews/ for the docs, sorted by what they show. It only adds or overwrites images: hand-written
// files such as previews/README.md are left alone, and the voice clips (.wav) are not copied.
tasks.register('previews', Copy) {
    group = 'documentation'
    description = 'Copies the offline renders from build/test-renders/ into previews/ (gods, particles, true-form, rift, vision, builds, manager, servants).'
    dependsOn tasks.named('test')
    from(layout.buildDirectory.dir('test-renders')) {
        include 'vessel-*.png', 'particles-*.png', 'rite-*.png', 'trueform-*.png',
                'pov*.png', 'overhead*.png', 'panorama*.png', 'minimap-*.png', 'build-*.png', 'design-*.png', 'manager-*.png', 'servant*.png', 'relic-*.png', 'rift-*.png', 'guide-*.png'
    }
    into layout.projectDirectory.dir('previews')
    includeEmptyDirs = false
    eachFile { details ->
        String n = details.name
        String folder = n.startsWith('vessel-') ? 'gods'
                : (n.startsWith('particles-') || n.startsWith('rite-')) ? 'particles'
                : n.startsWith('trueform-') ? 'true-form'
                : n.startsWith('design-') ? 'builds'
                : n.startsWith('manager-') ? 'manager'
                : n.startsWith('servant') ? 'servants'
                : n.startsWith('relic-') ? 'relics'
                : n.startsWith('rift-') ? 'rift'
                : n.startsWith('guide-') ? 'guide'
                : 'vision'
        details.path = folder + '/' + n
    }
}
