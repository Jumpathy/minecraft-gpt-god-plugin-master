plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

// A real client run that takes screenshots: ./gradlew runClientGameTest (output in build/run/clientGameTest/screenshots)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'gptgod-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
    // The God Manager screen's sample data (/godfx manager, screenshots) is the protocol's golden files.
    from('src/test/resources/protocol') {
        include 'gui-*.json', 'guide-*.json'
        include 'texture-*.json' // two painted textures for the demo scenes (/godfx scene idol)
        into 'gptgod-samples'
    }
}

// The relic game test shows the plugin's own painted relics: the same golden messages the unit tests decode.
tasks.matching { it.name == 'processGametestResources' }.configureEach {
    from('src/test/resources/protocol/relics') { into 'gptgod-relics' }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}
